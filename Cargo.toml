[workspace]
members = ["crates/libs/*", "crates/bins/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
description = """
daoyi-vue-rs
"""
license = "MIT"
authors = ["Gemiman <<gemiman@vip.qq.com>>"]
readme = "README.md"

[workspace.dependencies]
daoyi-common-support = { version = "0.1.0", path = "./crates/libs/daoyi-common-support" }
daoyi-entity-demo = { version = "0.1.0", path = "./crates/libs/daoyi-entity-demo" }
daoyi-api-demo = { version = "0.1.0", path = "./crates/libs/daoyi-api-demo" }
daoyi-macros = { version = "0.1.0", path = "./crates/libs/daoyi-macros" }
daoyi-entity-system = { version = "0.1.0", path = "./crates/libs/daoyi-entity-system" }
daoyi-api-system = { version = "0.1.0", path = "./crates/libs/daoyi-api-system" }
daoyi-entity-infra = { version = "0.1.0", path = "./crates/libs/daoyi-entity-infra" }
daoyi-api-infra = { version = "0.1.0", path = "./crates/libs/daoyi-api-infra" }
axum = { version = "0.8.8", features = ["macros", "ws"] }
tokio = { version = "1.49.0", features = ["full"] }
tracing = { version = "0.1.44", features = ["async-await"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "chrono"] }
tracing-appender = { version = "0.2.4" }
config = { version = "0.15.19", features = ["yaml"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = { version = "1.0.100" }
merge = { version = "0.2.0" }
sea-orm = { version = "1.1.19", features = ["with-chrono", "debug-print", "sqlx-postgres", "with-rust_decimal", "runtime-tokio"] }
num_cpus = { version = "1.17.0" }
thiserror = { version = "2.0.17" }
tower-http = { version = "0.6.8", features = ["trace", "timeout", "limit", "cors", "normalize-path", "auth"] }
xid = { version = "1.1.1" }
bytesize = "2.3.1"
validator = { version = "0.20.0", features = ["derive"] }
axum-valid = { version = "0.24.0", features = ["full_validator"] }
regex = "1.12.2"
idgenerator = "2.0.0"
bcrypt = "0.18.0"
wax = { version = "0.6.0" }
humantime = { version = "2.3.0" }
nacos-sdk = { version = "0.5.3", features = ["default"] }
redis = { version = "1.0.2", features = ["tokio-comp", "connection-manager", "streams"] }
reqwest = { version = "0.13.1", features = ["json", "query"] }
strum = { version = "0.27.2" }
strum_macros = { version = "0.27.2" }
serde_qs = "0.15.0"
strfmt = { version = "0.2.5" }
itertools = { version = "0.14.0" }
futures = { version = "0.3.31" }
syn = { version = "2.0.114", features = ["full", "extra-traits"] }
quote = { version = "1.0.43" }
async-trait = { version = "0.1.89" }
lettre = { version = "0.11.19", features = ["tokio1", "tokio1-rustls-tls", "builder", "hostname", "pool", "smtp-transport", "tracing"], default-features = false }
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"
base64 = "0.22.1"
sha1 = "0.10.6"
chrono = "0.4.43"
# S3
aws-config = "1.8.12"
aws-sdk-s3 = "1.119.0"
aws-credential-types = "1.2.11"
# FTP
suppaftp = "7.1.0"
# SFTP
ssh2 = "0.9.5"
# Utils
mime_guess = "2.0.5"
urlencoding = "2.1.3"

[package]
name = "daoyi-vue-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
